rules:
  # --------------------------------------------------------------------------
  # Regla didáctica para la demo de DevSecOps.
  # Detecta credenciales/secretos escritos directamente en el código
  # (contraseñas, API keys, tokens) en archivos JS/TS.
  # --------------------------------------------------------------------------
  - id: credencial-hardcodeada
    languages: [javascript, typescript]
    severity: ERROR
    message: |
      🔴 Credencial o secreto hardcodeado en el código.
      Nunca escribas contraseñas, API keys ni tokens directamente en el código:
      quedan expuestos en el repositorio para siempre. Muévelos a variables de
      entorno o a un secreto del pipeline (por ejemplo, GitHub Actions Secrets).
    metadata:
      category: security
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      references:
        - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
    patterns:
      - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(password|passwd|secret|api[_-]?key|apikey|token|access[_-]?key|credential).*

  # --------------------------------------------------------------------------
  # Detecta un AWS Access Key ID por su formato (AKIA + 16 caracteres),
  # sin importar el nombre de la variable ni el tipo de archivo.
  # --------------------------------------------------------------------------
  - id: aws-access-key-hardcodeada
    languages: [generic]
    severity: ERROR
    message: |
      🔴 Posible AWS Access Key ID hardcodeada en el código.
      Las llaves de AWS jamás deben commitearse: úsalas desde variables de
      entorno o un gestor de secretos.
    metadata:
      category: security
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
    options:
      generic_ellipsis_max_span_size: 500
    pattern-regex: \bAKIA[0-9A-Z]{16}\b
    paths:
      include:
        - "*.ts"
        - "*.tsx"
        - "*.js"
        - "*.jsx"
        - "*.json"
        - "*.env*"
        - "*.yml"
        - "*.yaml"
