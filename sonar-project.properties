# Configuración de SonarCloud.
# projectKey y organization deben coincidir con el proyecto en sonarcloud.io.
sonar.projectKey=josedelcastillo_generasocial
sonar.organization=josedelcastillo

# Qué analizar.
sonar.sources=src,amplify
sonar.exclusions=**/node_modules/**,dist/**,.shots/**,docs/**,**/*.md

# Espera el Quality Gate: el check de SonarCloud BLOQUEA si no cumple calidad/seguridad.
sonar.qualitygate.wait=true
