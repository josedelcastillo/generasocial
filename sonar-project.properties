# Configuración de SonarCloud.
# Verifica que projectKey y organization coincidan con los de tu proyecto en
# https://sonarcloud.io (los tomé de la URL: id=josedelcastillo_generasocial).
sonar.projectKey=josedelcastillo_generasocial
sonar.organization=josedelcastillo

# Qué analizar.
sonar.sources=src,amplify
sonar.exclusions=**/node_modules/**,dist/**,.shots/**,docs/**,**/*.md

# En esta rama de DEMO reactivamos la espera del Quality Gate para que el check
# de SonarCloud BLOQUEE el PR si el análisis no cumple la calidad/seguridad.
sonar.qualitygate.wait=true
