name: Semgrep

# Análisis de seguridad estático (SAST) con Semgrep.
# El token se toma del secret del repositorio SEMGREP_APP_TOKEN (no se hardcodea).
on:
  pull_request: {}
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch: {}
  schedule:
    # Escaneo semanal (lunes 06:00 UTC) para detectar nuevas reglas/hallazgos.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    # Imagen oficial de Semgrep con el CLI preinstalado.
    container:
      image: semgrep/semgrep
    # Evita correr en PRs abiertos por dependabot (no expone secrets).
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep CI
        # Reglas propias de la demo (./semgrep-rules) + reglas de la comunidad
        # (p/default). El token conecta los hallazgos al panel de Semgrep.
        # Para una demo SIN token, reemplaza esta línea por:
        #   semgrep scan --config ./semgrep-rules --config "p/default" --error
        run: semgrep ci --config ./semgrep-rules --config "p/default"
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
