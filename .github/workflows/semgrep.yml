name: Semgrep

# Análisis de seguridad estático (SAST) con Semgrep.
# El token se toma del secret del repositorio SEMGREP_APP_TOKEN (no se hardcodea).
on:
  pull_request: {}
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch: {}
  schedule:
    # Escaneo semanal (lunes 06:00 UTC) para detectar nuevas reglas/hallazgos.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest
    # Imagen oficial de Semgrep con el CLI preinstalado.
    container:
      image: semgrep/semgrep
    # Evita correr en PRs abiertos por dependabot (no expone secrets).
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan
        # Escaneo determinista con nuestras reglas. `--error` hace que el
        # pipeline FALLE (exit 1) si hay hallazgos: esa es la compuerta de
        # seguridad de la demo. No se usa `semgrep ci` porque, estando
        # "logueado" con el token, rechaza `--config` y usaría solo la política
        # configurada en la nube de Semgrep (dejando pasar el secreto).
        run: semgrep scan --config ./semgrep-rules --error
